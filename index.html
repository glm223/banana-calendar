<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보드에바나나 · 파티 등록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #F7F7F8;
    --surface: #FFFFFF;
    --border: #E4E4E7;
    --border-focus: #A1A1AA;
    --text: #18181B;
    --text-sub: #71717A;
    --text-placeholder: #A1A1AA;
    --accent: #3F3F46;
    --accent-hover: #27272A;
    --danger: #EF4444;
    --success: #16A34A;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px 80px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon {
    width: 32px; height: 32px;
    background: var(--text);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .brand-name { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
  .brand-desc { font-size: 11px; color: var(--text-sub); margin-top: 1px; }
  .gear-btn {
    background: none; border: none; cursor: pointer;
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-sub); font-size: 15px;
    transition: background 0.15s;
  }
  .gear-btn:hover { background: var(--bg); }

  #settingsPanel {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
  }
  .settings-section-title {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--text-sub); margin-bottom: 10px;
  }
  .settings-block { margin-bottom: 20px; }
  .settings-block:last-child { margin-bottom: 0; }

  .card-body { padding: 24px; }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text-sub); margin-bottom: 6px; letter-spacing: 0.2px;
  }
  input[type=text], input[type=date], input[type=number], select {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border); background: var(--surface);
    border-radius: var(--radius-sm); font-size: 14px;
    font-family: inherit; color: var(--text); appearance: none;
    transition: border-color 0.15s, box-shadow 0.15s; outline: none;
  }
  input[type=text]:focus, input[type=date]:focus,
  input[type=number]:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(63,63,70,0.08);
  }
  ::placeholder { color: var(--text-placeholder); }
  .hint { font-size: 11px; color: var(--text-sub); margin-top: 5px; line-height: 1.6; }

  .party-list { list-style: none; margin-bottom: 8px; }
  .party-list li {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    margin-bottom: 6px; font-size: 13px;
  }
  .party-list li .pname { flex: 1; font-weight: 600; }
  .party-list li input[type=number] { width: 62px; padding: 5px 8px; font-size: 12px; }
  .party-list li button {
    background: none; border: none; cursor: pointer;
    color: var(--text-sub); font-size: 14px; padding: 2px 4px;
    border-radius: 4px; transition: color 0.15s;
  }
  .party-list li button:hover { color: var(--danger); }

  .add-row { display: flex; gap: 6px; }
  .add-row input[type=text] { flex: 1; }
  .add-row input[type=number] { width: 72px; }

  .btn-sm {
    padding: 8px 12px; font-size: 13px; font-weight: 600;
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius-sm); cursor: pointer;
    font-family: inherit; white-space: nowrap;
    transition: background 0.15s;
  }
  .btn-sm:hover { background: var(--accent-hover); }

  .btn-icon {
    width: 38px; height: 38px; font-size: 18px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer; transition: background 0.15s;
  }
  .btn-icon:hover { background: var(--border); }

  .party-row { display: flex; gap: 8px; align-items: flex-end; }
  .party-row select { flex: 1; }

  .slot-options { display: flex; gap: 8px; }
  .slot-option {
    flex: 1; border: 1px solid var(--border); background: var(--surface);
    border-radius: var(--radius-sm); padding: 10px 8px;
    cursor: pointer; text-align: center; font-size: 12px;
    font-weight: 600; color: var(--text-sub);
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    line-height: 1.5;
  }
  .slot-option:hover { border-color: var(--border-focus); color: var(--text); }
  .slot-option.selected { border-color: var(--text); background: var(--text); color: #fff; }
  .slot-fixed {
    padding: 10px 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600; color: var(--text-sub);
  }

  .preview-box {
    padding: 14px 16px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    display: flex; align-items: center; gap: 10px;
  }
  .preview-label { font-size: 11px; font-weight: 600; color: var(--text-sub); white-space: nowrap; }
  .preview-title { font-size: 14px; font-weight: 700; color: var(--text); word-break: break-all; }

  .submit-btn {
    width: 100%; margin-top: 24px; padding: 13px;
    background: var(--text); color: #fff; font-size: 14px;
    font-weight: 700; font-family: inherit; border: none;
    border-radius: var(--radius-md); cursor: pointer;
    transition: background 0.15s, transform 0.08s, opacity 0.15s;
    letter-spacing: -0.2px;
  }
  .submit-btn:hover { background: var(--accent-hover); }
  .submit-btn:active { transform: scale(0.99); }
  .submit-btn:disabled { opacity: 0.45; cursor: default; }

  #statusMsg {
    margin-top: 12px; font-size: 13px;
    text-align: center; line-height: 1.6; min-height: 20px;
  }
  #statusMsg.ok { color: var(--success); font-weight: 600; }
  #statusMsg.err { color: var(--danger); font-weight: 600; }
  #statusMsg a { color: var(--text); }

  .empty-hint {
    font-size: 12px; color: var(--text-sub);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 6px;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <header class="card-header">
    <div class="brand">
      <div class="brand-icon">🍌</div>
      <div>
        <div class="brand-name">보드에바나나</div>
        <div class="brand-desc">파티 일정, 캘린더에 한 번에 등록</div>
      </div>
    </div>
    <button type="button" class="gear-btn" id="settingsToggle"
      aria-expanded="false" aria-controls="settingsPanel" title="설정">⚙️</button>
  </header>

  <section id="settingsPanel" hidden>
    <div class="settings-block">
      <div class="settings-section-title">Google OAuth</div>
      <div class="field">
        <label for="clientIdInput">클라이언트 ID</label>
        <input type="text" id="clientIdInput" placeholder="xxxxxx.apps.googleusercontent.com">
        <div class="hint">Google Cloud Console에서 발급한 웹 앱용 클라이언트 ID. 이 브라우저에만 저장됩니다.</div>
      </div>
    </div>
    <div class="settings-block">
      <div class="settings-section-title">파티 목록</div>
      <ul class="party-list" id="partyList"></ul>
      <div class="add-row">
        <input type="text" id="newPartyName" placeholder="파티 이름">
        <input type="number" id="newPartyCount" placeholder="회차" value="0" min="0">
        <button type="button" class="btn-sm" id="addPartyBtn">추가</button>
      </div>
      <div class="hint">회차는 마지막으로 진행된 번호. 다음 등록 시 +1 됩니다.</div>
    </div>
  </section>

  <div class="card-body">
    <form id="partyForm">
      <div class="field">
        <label for="partySelect">파티</label>
        <div class="party-row">
          <select id="partySelect"></select>
          <button type="button" class="btn-icon" id="focusAddParty" title="새 파티 추가">+</button>
        </div>
        <div class="empty-hint" id="noPartyHint" hidden>등록된 파티가 없어요. ⚙️ 설정에서 파티를 추가해주세요.</div>
      </div>

      <div class="field">
        <label for="dateInput">날짜</label>
        <input type="date" id="dateInput" required>
      </div>

      <div class="field">
        <label id="slotLabel">시간</label>
        <div id="slotContainer"></div>
      </div>

      <div class="field">
        <label>등록 제목</label>
        <div class="preview-box">
          <span class="preview-label">제목</span>
          <span class="preview-title" id="titlePreview">파티를 선택해주세요</span>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span id="submitLabel">구글 캘린더에 등록</span>
      </button>
      <div id="statusMsg" role="status" aria-live="polite"></div>
    </form>
  </div>
</main>

<script>
(function(){
  const LS_CLIENT_ID = 'bp_client_id';
  const LS_PARTIES   = 'bp_parties';
  const TITLE_PREFIX = '보드에바나나';
  const TIMEZONE     = 'Asia/Seoul';
  const SCOPE        = 'https://www.googleapis.com/auth/calendar.events';

  let parties = JSON.parse(localStorage.getItem(LS_PARTIES) || '[]');
  let selectedSlotIndex = 0;
  let tokenClient = null;
  let accessToken  = null;
  let currentSlots = [];

  const settingsToggle = document.getElementById('settingsToggle');
  const settingsPanel  = document.getElementById('settingsPanel');
  const clientIdInput  = document.getElementById('clientIdInput');
  const partyListEl    = document.getElementById('partyList');
  const newPartyName   = document.getElementById('newPartyName');
  const newPartyCount  = document.getElementById('newPartyCount');
  const addPartyBtn    = document.getElementById('addPartyBtn');
  const focusAddParty  = document.getElementById('focusAddParty');
  const partySelect    = document.getElementById('partySelect');
  const noPartyHint    = document.getElementById('noPartyHint');
  const dateInput      = document.getElementById('dateInput');
  const slotContainer  = document.getElementById('slotContainer');
  const slotLabel      = document.getElementById('slotLabel');
  const titlePreview   = document.getElementById('titlePreview');
  const partyForm      = document.getElementById('partyForm');
  const submitBtn      = document.getElementById('submitBtn');
  const submitLabel    = document.getElementById('submitLabel');
  const statusMsg      = document.getElementById('statusMsg');

  clientIdInput.value = localStorage.getItem(LS_CLIENT_ID) || '';
  dateInput.value = new Date().toISOString().slice(0, 10);

  function saveParties()  { localStorage.setItem(LS_PARTIES, JSON.stringify(parties)); }
  function saveClientId() { localStorage.setItem(LS_CLIENT_ID, clientIdInput.value.trim()); }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderPartyManager() {
    partyListEl.innerHTML = '';
    parties.forEach((p, idx) => {
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="pname">${escapeHtml(p.name)}</span>
        <input type="number" min="0" value="${p.count}" data-idx="${idx}" class="count-input">
        <button type="button" data-idx="${idx}" class="del-btn" title="삭제">✕</button>`;
      partyListEl.appendChild(li);
    });
    partyListEl.querySelectorAll('.count-input').forEach(inp => {
      inp.addEventListener('change', e => {
        parties[+e.target.dataset.idx].count = Math.max(0, parseInt(e.target.value) || 0);
        saveParties(); renderPartySelect(); updateTitlePreview();
      });
    });
    partyListEl.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        const idx = +e.target.dataset.idx;
        if (confirm(`"${parties[idx].name}" 파티를 삭제할까요?`)) {
          parties.splice(idx, 1);
          saveParties(); renderPartyManager(); renderPartySelect(); updateTitlePreview();
        }
      });
    });
  }

  function renderPartySelect() {
    const prev = partySelect.value;
    partySelect.innerHTML = '';
    if (parties.length === 0) {
      noPartyHint.hidden = false; partySelect.disabled = true; return;
    }
    noPartyHint.hidden = true; partySelect.disabled = false;
    parties.forEach((p, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `${p.name}  (${p.count}회 진행됨)`;
      partySelect.appendChild(opt);
    });
    if (prev !== '' && +prev < parties.length) partySelect.value = prev;
  }

  addPartyBtn.addEventListener('click', () => {
    const name = newPartyName.value.trim();
    if (!name) { newPartyName.focus(); return; }
    parties.push({ name, count: Math.max(0, parseInt(newPartyCount.value) || 0) });
    saveParties();
    newPartyName.value = ''; newPartyCount.value = '0';
    renderPartyManager(); renderPartySelect(); updateTitlePreview();
  });

  focusAddParty.addEventListener('click', () => {
    settingsPanel.hidden = false;
    settingsToggle.setAttribute('aria-expanded', 'true');
    newPartyName.focus();
  });

  settingsToggle.addEventListener('click', () => {
    const hidden = settingsPanel.hidden;
    settingsPanel.hidden = !hidden;
    settingsToggle.setAttribute('aria-expanded', String(hidden));
  });

  clientIdInput.addEventListener('change', saveClientId);

  function getSlotsForDate(dateStr) {
    const day = new Date(dateStr + 'T00:00:00').getDay();
    const isWeekend = day === 0 || day === 6;
    if (!isWeekend) return [{ label: '평일 저녁', sub: '19:30 – 22:30', start: '19:30', end: '22:30' }];
    return [
      { label: '주말 점심', sub: '12:30 – 15:30', start: '12:30', end: '15:30' },
      { label: '주말 저녁', sub: '18:30 – 21:30', start: '18:30', end: '21:30' }
    ];
  }

  function renderSlots() {
    const slots = getSlotsForDate(dateInput.value);
    slotContainer.innerHTML = '';
    if (slots.length === 1) {
      slotLabel.textContent = '시간';
      const div = document.createElement('div');
      div.className = 'slot-fixed';
      div.textContent = `${slots[0].label}  ${slots[0].sub}`;
      slotContainer.appendChild(div);
      selectedSlotIndex = 0;
    } else {
      slotLabel.textContent = '시간';
      const wrap = document.createElement('div');
      wrap.className = 'slot-options';
      slots.forEach((s, idx) => {
        const opt = document.createElement('div');
        opt.className = 'slot-option' + (idx === selectedSlotIndex ? ' selected' : '');
        opt.innerHTML = `<div>${s.label}</div><div style="font-weight:400;opacity:0.75;margin-top:2px">${s.sub}</div>`;
        opt.addEventListener('click', () => { selectedSlotIndex = idx; renderSlots(); });
        wrap.appendChild(opt);
      });
      slotContainer.appendChild(wrap);
      if (selectedSlotIndex >= slots.length) selectedSlotIndex = 0;
    }
    currentSlots = slots;
  }

  dateInput.addEventListener('change', () => { selectedSlotIndex = 0; renderSlots(); });

  function updateTitlePreview() {
    if (parties.length === 0 || partySelect.value === '') {
      titlePreview.textContent = '파티를 선택해주세요'; return;
    }
    const p = parties[+partySelect.value];
    titlePreview.textContent = `${TITLE_PREFIX}_${p.name}_${p.count + 1}`;
  }
  partySelect.addEventListener('change', updateTitlePreview);

  function getClientId() { return localStorage.getItem(LS_CLIENT_ID) || clientIdInput.value.trim(); }

  function ensureTokenClient() {
    const clientId = getClientId();
    if (!clientId) throw new Error('NO_CLIENT_ID');
    if (!tokenClient || tokenClient.__clientId !== clientId) {
      tokenClient = google.accounts.oauth2.initTokenClient({ client_id: clientId, scope: SCOPE, callback: () => {} });
      tokenClient.__clientId = clientId;
    }
  }

  function getAccessToken() {
    return new Promise((resolve, reject) => {
      try { ensureTokenClient(); } catch(e) { reject(e); return; }
      tokenClient.callback = (resp) => {
        if (resp.error) { reject(resp); return; }
        accessToken = resp.access_token; resolve(accessToken);
      };
      tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
    });
  }

  async function insertCalendarEvent(title, dateStr, startTime, endTime) {
    const token = await getAccessToken();
    const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        summary: title,
        start: { dateTime: `${dateStr}T${startTime}:00`, timeZone: TIMEZONE },
        end:   { dateTime: `${dateStr}T${endTime}:00`,   timeZone: TIMEZONE }
      })
    });
    if (!res.ok) {
      const err = new Error('CALENDAR_API_ERROR');
      err.detail = await res.text(); err.status = res.status; throw err;
    }
    return res.json();
  }

  partyForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusMsg.textContent = ''; statusMsg.className = '';

    if (parties.length === 0 || partySelect.value === '') {
      statusMsg.textContent = '파티를 먼저 선택하거나 추가해주세요.';
      statusMsg.className = 'err'; return;
    }
    if (!getClientId()) {
      statusMsg.textContent = '⚙️ 설정에서 구글 OAuth 클라이언트 ID를 먼저 입력해주세요.';
      statusMsg.className = 'err';
      settingsPanel.hidden = false; settingsToggle.setAttribute('aria-expanded', 'true'); return;
    }

    const idx   = +partySelect.value;
    const party = parties[idx];
    const nextCount = party.count + 1;
    const title = `${TITLE_PREFIX}_${party.name}_${nextCount}`;
    const slot  = currentSlots[selectedSlotIndex];

    submitBtn.disabled = true;
    submitLabel.textContent = '등록 중…';

    try {
      const result = await insertCalendarEvent(title, dateInput.value, slot.start, slot.end);
      party.count = nextCount;
      saveParties(); renderPartyManager(); renderPartySelect();
      partySelect.value = idx; updateTitlePreview();
      statusMsg.className = 'ok';
      statusMsg.innerHTML = `"${escapeHtml(title)}" 등록 완료` +
        (result.htmlLink ? ` · <a href="${result.htmlLink}" target="_blank" rel="noopener">캘린더에서 보기 →</a>` : '');
    } catch(err) {
      statusMsg.className = 'err';
      if (err?.message === 'NO_CLIENT_ID') {
        statusMsg.textContent = '⚙️ 설정에서 구글 OAuth 클라이언트 ID를 먼저 입력해주세요.';
      } else if (err?.error === 'popup_closed_by_user') {
        statusMsg.textContent = '로그인 창이 닫혔어요. 다시 시도해주세요.';
      } else {
        statusMsg.textContent = '등록하지 못했어요. 클라이언트 ID와 승인된 도메인 설정을 확인해주세요.';
        console.error(err);
      }
    } finally {
      submitBtn.disabled = false;
      submitLabel.textContent = '구글 캘린더에 등록';
    }
  });

  renderPartyManager();
  renderPartySelect();
  renderSlots();
  updateTitlePreview();
})();
</script>
</body>
</html>
